[project]
name = "herdr-openspec"
version = "0.5.0"
description = "OpenSpec status in the herdr sidebar and a change browser"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ospec = "ospec.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
ospec = ["page.html"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PL", "PTH", "RUF", "EXE", "TC", "C4", "RET", "PIE"]
ignore = [
  "PLR2004",  # magic numbers: key codes and layout sizes read better inline
  "RUF001",   # ambiguous unicode: box-drawing and symbols are intentional
]

[tool.ruff.lint.isort]
known-first-party = ["ospec", "helpers"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0913"]

[tool.pyright]
pythonVersion = "3.9"
include = ["src", "tests"]
extraPaths = ["src", "tests"]
typeCheckingMode = "standard"
