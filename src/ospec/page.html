<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root { --bg:#fff; --fg:#1f2328; --muted:#656d76; --line:#d1d9e0; --code:#f6f8fa; --accent:#0969da; }
@media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#30363d; --code:#161b22; --accent:#4493f8; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
nav { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; gap:18px; flex-wrap:wrap; z-index:1; }
nav b { margin-right:8px; } nav a { color:var(--accent); text-decoration:none; }
main { max-width:900px; margin:0 auto; padding:8px 16px 80px; }
section { border-bottom:1px solid var(--line); padding:16px 0 24px; scroll-margin-top:52px; }
.kind { color:var(--muted); font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
pre, code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; }
pre { background:var(--code); padding:12px; border-radius:6px; overflow-x:auto; }
:not(pre) > code { background:var(--code); padding:1px 5px; border-radius:4px; }
.mermaid { background:var(--code); border-radius:6px; padding:16px; text-align:center; overflow-x:auto; }
table { border-collapse:collapse; display:block; overflow-x:auto; } th, td { border:1px solid var(--line); padding:4px 10px; }
li:has(> input[type=checkbox]) { list-style:none; margin-left:-1.2em; } input[type=checkbox] { margin-right:6px; }
li:has(> input:checked) { color:var(--muted); }
</style></head><body>
<nav><b>__TITLE__</b>__NAV__</nav>
<main id="docs"></main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
const DOCS = __DOCS__;
const main = document.getElementById("docs");
for (const d of DOCS) {
  const s = document.createElement("section");
  s.id = d.id;
  s.innerHTML = `<div class="kind">${d.label}</div>` + marked.parse(d.markdown);
  main.appendChild(s);
}
for (const code of document.querySelectorAll("code.language-mermaid")) {
  const div = document.createElement("div");
  div.className = "mermaid";
  div.textContent = code.textContent;
  code.parentElement.replaceWith(div);
}
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default" });
mermaid.run().then(() => { if (location.hash) document.querySelector(location.hash)?.scrollIntoView(); });
</script></body></html>
